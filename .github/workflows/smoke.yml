name: Cache v2 smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "seed publishes; restore must download an entry created by an earlier run"
        required: true
        default: restore
        type: choice
        options:
          - restore
          - seed

permissions:
  contents: read
  actions: read

# Shared with the optimiser smoke test, which rewrites the same key prefix.
concurrency:
  group: bazel-smoke-cache
  cancel-in-progress: false

jobs:
  smoke:
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      # Build locally so the smoke test exercises this commit rather than a
      # binary downloaded from a release.
      - name: Build server binaries
        shell: bash
        env:
          VERSION: smoke-${{ github.sha }}
        run: scripts/build-dist.sh
      - id: cache
        name: Start cache adapter
        uses: ./
        with:
          write: ${{ github.event_name == 'push' || inputs.mode == 'seed' }}
          key-prefix: bazel-http-smoke-car-v1
          storage-mode: packs
      - name: Prepare stable object
        id: object
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const data = Buffer.from("bazel-github-actions-cache-v2-smoke-v0.2.0");
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "cache-object"), data);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `digest=${crypto.createHash("sha256").update(data).digest("hex")}\n`);
          NODE
      - name: Seed cache
        if: github.event_name == 'push' || inputs.mode == 'seed'
        shell: bash
        env:
          CACHE_URL: ${{ steps.cache.outputs.url }}
          DIGEST: ${{ steps.object.outputs.digest }}
        run: curl --fail-with-body --silent --show-error --upload-file "$RUNNER_TEMP/cache-object" "$CACHE_URL/cas/$DIGEST"
      - name: Restore cache object
        shell: bash
        env:
          CACHE_URL: ${{ steps.cache.outputs.url }}
          DIGEST: ${{ steps.object.outputs.digest }}
        run: |
          curl --fail-with-body --silent --show-error "$CACHE_URL/cas/$DIGEST" --output "$RUNNER_TEMP/restored"
          cmp "$RUNNER_TEMP/cache-object" "$RUNNER_TEMP/restored"
      - name: Require a persistent backend hit in restore-only runs
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'restore'
        shell: bash
        env:
          STATS_URL: ${{ steps.cache.outputs.stats-url }}
        run: |
          curl --fail-with-body --silent --show-error "$STATS_URL" --output "$RUNNER_TEMP/stats.json"
          jq --exit-status '.backend_downloads == 2 and .pack_downloads == 1 and .hits == 1' "$RUNNER_TEMP/stats.json"
