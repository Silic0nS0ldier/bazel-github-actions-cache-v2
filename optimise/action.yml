name: Optimise Bazel cache layout
description: Regroup CARv2 packs around how recent jobs actually read them, and delete what it replaces
author: cre4ture
branding:
  icon: package
  color: green
inputs:
  github-token:
    description: "Token with actions: write; required to delete the cache entries this pass replaces"
    required: true
  key-prefix:
    description: "Immutable GitHub cache-key namespace to optimise; must match the cache action's key-prefix"
    required: false
    default: bazel-http-v1
  usage-artifact:
    description: "Job artifact the cache action publishes its usage records to"
    required: false
    default: bazel-cache-usage
  max-records:
    description: "How many recent runs to plan from"
    required: false
    default: "25"
  min-runs:
    description: "Refuse to plan from fewer usage records than this; too small a window describes particular jobs rather than the repository"
    required: false
    default: "3"
  pack-size-mb:
    description: "Target size of a rebuilt pack in MiB (1-32)"
    required: false
    default: "8"
  min-waste-fraction:
    description: "How much of a pack must be bytes an average restore pays for and does not want before rebuilding it (0-1)"
    required: false
    default: "0.25"
  max-blob-size-mb:
    description: "Maximum object size in MiB"
    required: false
    default: "512"
  max-new-mb:
    description: "Stop a pass once it has published this many MiB, so a cache near its quota is not asked to hold the old and new layouts at once; 0 means no limit"
    required: false
    default: "2048"
  uploads-per-minute:
    description: "Evenly spaced uploads; must be below 200"
    required: false
    default: "180"
  reap-unmanifested-packs:
    description: "Delete packs that no manifest names at all. These are unreachable, but this is the one thing here that removes data without publishing a replacement"
    required: false
    default: "false"
  reap-older-than-hours:
    description: "Only reap packs older than this, so a pack a running job has published but not yet committed a manifest for is out of reach"
    required: false
    default: "24"
  backend-timeout-seconds:
    description: "Timeout for one GitHub cache operation"
    required: false
    default: "300"
  dry-run:
    description: "Plan and report without publishing or deleting anything"
    required: false
    default: "false"
  job-summary:
    description: "Write the result to the job summary"
    required: false
    default: "true"
outputs:
  summary:
    description: "JSON result of the pass"
  rebuilt:
    description: "Number of packs rebuilt"
  deleted:
    description: "Number of packs deleted"
  reaped:
    description: "Number of unreachable packs reaped"
runs:
  using: node24
  main: main.js
