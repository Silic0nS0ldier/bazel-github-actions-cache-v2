# Generated code is committed to the repository; run scripts/generate-proto.sh to refresh it.
version: v2
inputs:
  - directory: proto
plugins:
  # google.golang.org/protobuf >= 1.36 opaque API: struct fields are hidden behind
  # accessors, which lets the runtime pick a more compact in-memory layout.
  - local: protoc-gen-go
    out: internal/proto/gen
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
      - Mbuild/bazel/semver/semver.proto=github.com/cre4ture/bazel-github-actions-cache-v2/internal/proto/gen/build/bazel/semver;semver
      - Mbuild/bazel/remote/execution/v2/remote_execution.proto=github.com/cre4ture/bazel-github-actions-cache-v2/internal/proto/gen/build/bazel/remote/execution/v2;remoteexecution
