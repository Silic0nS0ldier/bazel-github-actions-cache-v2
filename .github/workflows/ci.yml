name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Go tests with race detector
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Node wrapper tests
        run: node --test action/*.test.js optimise/*.test.js
      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Build packaged binaries
        env:
          VERSION: ci-${{ github.sha }}
        run: scripts/build-dist.sh
      - name: Verify packaged binaries are reproducible
        env:
          VERSION: ci-${{ github.sha }}
        run: |
          mv dist/SHA256SUMS "$RUNNER_TEMP/SHA256SUMS.first"
          scripts/build-dist.sh
          diff "$RUNNER_TEMP/SHA256SUMS.first" dist/SHA256SUMS

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Cache server Go tests with race detector
        run: go test -race ./cmd/cache-server ./internal/server ./internal/cache ./internal/artifact
      - name: Node cache server wrapper tests
        run: node --test action/*.test.js
      - name: Build packaged binaries
        env:
          VERSION: ci-${{ github.sha }}
        run: scripts/build-dist.sh
      - name: Verify packaged checksums and native server
        env:
          VERSION: ci-${{ github.sha }}
        run: |
          (cd dist && shasum -a 256 --check SHA256SUMS)
          test "$(dist/cache-server-darwin-arm64 --version)" = "$VERSION"

  windows:
    strategy:
      matrix:
        include:
          - runner: windows-2025
            architecture: amd64
            race: "-race"
          - runner: windows-11-arm
            architecture: arm64
            race: ""
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
          architecture: ${{ matrix.architecture == 'amd64' && 'x64' || matrix.architecture }}
      - name: Require native Go architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
      # Go does not support the race detector on Windows ARM64.
      - name: Cache server Go tests
        env:
          RACE: ${{ matrix.race }}
        run: go test $RACE ./cmd/cache-server ./internal/server ./internal/cache ./internal/artifact
      - name: Node cache server wrapper and lifecycle tests
        run: node --test action/*.test.js
      - name: Build packaged binaries
        env:
          VERSION: ci-${{ github.sha }}
        run: scripts/build-dist.sh
      - name: Verify packaged checksums and native server
        env:
          VERSION: ci-${{ github.sha }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(dist/cache-server-windows-$ARCHITECTURE.exe --version)" = "$VERSION"
