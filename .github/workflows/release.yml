name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.4.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v1.2.3 or v1.2.3-rc.1; got $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse to reuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION already exists; immutable releases cannot reuse a tag" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Publish
        uses: ./.github/actions/publish-release
        with:
          version: ${{ inputs.version }}
          prerelease: "false"
          token: ${{ github.token }}
          notes: |
            Release ${{ inputs.version }}, built from `${{ github.sha }}`.

            Pin this action with:

            ```yaml
            uses: ${{ github.repository }}@${{ inputs.version }}
            ```
